<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Edit Policy — Admin</title>

  <style>
/*
    :root{
      --bg:#0e1726;
      --panel:#1e293b;
      --panel-2:#1e293b;
      --muted:#94a3b8;
      --muted-2:#94a3b8;
      --accent:#2563eb;
      --danger:#ef4444;
      --radius:8px;
      --shadow: 0 8px 24px rgba(2,6,23,0.6);
      --glass: rgba(255,255,255,0.02);
      --max-width:900px;
    }
*/

    :root {
      --bg: #f9fafb;
      --panel: #ffffff;
      --panel-2: #f1f5f9;
      --muted: #475569;
      --muted-2: #64748b;
      --accent: #2563eb;
      --danger: #dc2626;
      --radius: 8px;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
      --glass: rgba(255, 255, 255, 0.8);
      --max-width:900px
    }

    html,body{
      height:100%;
      margin:0;
      font-family: Inter, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background:var(--bg);
      color:var(--muted);
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    /* NAVBAR */
    .navbar{
      position:fixed;
      top:0;
      left:0;
      right:0;
      height:64px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 18px;
      background:var(--panel);
      border-bottom:1px solid rgba(255,255,255,0.03);
      z-index:1200;
    }
    .nav-left{ display:flex; align-items:center; gap:18px; }
    .nav-brand{
      font-weight:600;
      color:var(--muted);
      font-size:16px;
      display:inline-block;
      padding-right:6px;
    }
    .nav-tabs{ display:flex; gap:8px; align-items:center; }
    .nav-tabs a{
      color:var(--muted-2);
      text-decoration:none;
      padding:8px 12px;
      border-radius:6px;
      font-size:14px;
      display:inline-flex;
      align-items:center;
    }
    .nav-tabs a:hover{ background:var(--glass); color:var(--muted); }
    .nav-tabs a.active{
      color:var(--muted);
      box-shadow: inset 0 -3px 0 var(--accent);
      position:relative;
      font-weight:600;
    }
    .nav-right{ display:flex; align-items:center; gap:12px; position:relative; }
    .user-btn{
      background:transparent;
      border:1px solid rgba(255,255,255,0.03);
      color:var(--muted);
      padding:8px 10px;
      border-radius:10px;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      gap:8px;
      font-size:13px;
    }
    .user-btn:focus{ outline:none; }
    .user-dropdown{
      position:absolute;
      right:0px;
      top:calc(100% + 8px);
      background:var(--panel-2);
      border-radius:8px;
      box-shadow:var(--shadow);
      min-width:180px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,0.03);
      display:none;
      z-index:1300;
    }
    .user-dropdown.show{ display:block; }
    .user-dropdown button{
      width:100%;
      background:transparent;
      border:none;
      text-align:left;
      padding:10px 12px;
      color:var(--muted);
      cursor:pointer;
      font-size:14px;
    }
    .user-dropdown button:hover{ background:rgba(255,255,255,0.02); }

    /* PAGE LAYOUT */
    main.page {
      padding: 92px 18px 40px;
      display:flex;
      justify-content:center;
    }
    .card {
      width:100%;
      max-width:var(--max-width);
      background: linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.00));
      border-radius:var(--radius);
      padding:20px;
      box-shadow:var(--shadow);
      border:1px solid rgba(255,255,255,0.02);
    }
    .card h1 {
      margin:0 0 8px 0;
      color:var(--muted);
      font-size:20px;
      font-weight:700;
    }
    .card p.lead {
      margin:0 0 18px 0;
      color:var(--muted-2);
      font-size:13px;
    }

    /* FORM LAYOUT */
    form.policy-form {
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    .row {
      display:flex;
      gap:12px;
      align-items:flex-start;
      flex-wrap:wrap;
    }
    .col {
      flex:1;
      min-width:220px;
    }
    label.field-label {
      display:block;
      font-size:13px;
      margin-bottom:6px;
      color:var(--muted-2);
      font-weight:600;
    }
    input[type="text"],
    input[readonly],
    textarea,
    select {
      width:100%;
      padding:10px 12px;
      background:transparent;
      border:1px solid rgba(255,255,255,0.04);
      border-radius:8px;
      color:var(--muted);
      font-size:14px;
      box-sizing:border-box;
    }
    input[readonly] {
      opacity:0.85;
      background:rgba(255,255,255,0.01);
    }
    textarea {
      resize:vertical;
      min-height:72px;
      max-height:280px;
    }

    /* radio groups */
    .radio-group {
      display:flex;
      gap:8px;
      align-items:center;
      flex-wrap:wrap;
    }
    .radio-option {
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 10px;
      border-radius:8px;
      border:1px solid rgba(255,255,255,0.03);
      cursor:pointer;
      background:transparent;
      color:var(--muted);
      font-size:13px;
    }
    .radio-option input {
      accent-color:var(--accent);
    }
    .radio-option.active {
      box-shadow: inset 0 -3px 0 var(--accent);
      color:var(--muted);
      font-weight:600;
      background:var(--panel-2);
    }

    /* foot actions */
    .form-actions {
      display:flex;
      gap:12px;
      justify-content:flex-end;
      align-items:center;
      margin-top:8px;
    }
    button.btn {
      padding:10px 14px;
      border-radius:8px;
      border:none;
      cursor:pointer;
      font-weight:700;
      font-size:14px;
    }
    button.btn:active { transform:translateY(1px); }
    .btn-danger {
      background: linear-gradient(180deg, #f43f3f, #e03131);
      color: #fff;
      box-shadow: 0 6px 18px rgba(228,43,43,0.18);
    }
    .btn-accent {
      background: linear-gradient(180deg, var(--accent), #0062d6);
      color: #fff;
      box-shadow: 0 6px 18px rgba(37,99,235,0.14);
    }
    .btn-ghost {
      background:transparent;
      border:1px solid rgba(255,255,255,0.04);
      color:var(--muted);
    }

    /* helper text */
    .hint {
      font-size:12px;
      color:var(--muted-2);
      margin-top:6px;
    }

    /* responsive tweaks */
    @media (max-width:820px){
      .row { flex-direction:column; }
      .form-actions { justify-content:stretch; flex-direction:column-reverse; gap:8px; }
      .form-actions button { width:100%; }
    }

    /* small status message */
    .status {
      padding:10px 12px;
      border-radius:8px;
      font-size:13px;
      display:none;
    }
    .status.show { display:block; }
    .status.ok { background: rgba(37,99,235,0.08); color:var(--muted); border:1px solid rgba(37,99,235,0.06); }
    .status.err { background: rgba(239,68,68,0.06); color:var(--muted); border:1px solid rgba(239,68,68,0.06); }

  </style>
</head>
<body>
  <!-- NAV -->
  <header class="navbar" role="banner">
    <div class="nav-left">
      <div class="nav-brand">SDN Firewall</div>
      <nav class="nav-tabs" role="navigation" aria-label="Main">
        <a href="/logs">Log</a>
        <a href="/dashboard">Policy</a>
      </nav>
    </div>

    <div class="nav-right">
      <button class="user-btn" id="userBtn" aria-haspopup="true" aria-expanded="false" title="Account menu">
            <!-- simple SVG user icon -->
            <span aria-hidden="true" style="display:inline-block; width:16px; height:16px;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 12c2.761 0 5-2.239 5-5s-2.239-5-5-5-5 2.239-5 5 2.239 5 5 5z" fill="currentColor" />
                <path d="M4 20c0-3.314 2.686-6 6-6h4c3.314 0 6 2.686 6 6v1H4v-1z" fill="currentColor" />
            </svg>
            </span>
        </button>

      <div class="user-dropdown" id="userDropdown" role="menu" aria-hidden="true">
        <button id="logoutBtn" role="menuitem">Logout</button>
        <button id="changePwBtn" role="menuitem">Change Password</button>
      </div>
    </div>
  </header>

  <main class="page" role="main">
    <section class="card" aria-labelledby="editTitle">
      <h1 id="editTitle">Edit Policy</h1>
      <p class="lead">Edit firewall policy fields below. Fields with multiple entries accept one item per line.</p>

      <div id="status" class="status" role="status" aria-live="polite"></div>

      <form id="policyForm" class="policy-form" onsubmit="return false;">
        <!-- top row: id (readonly) and name -->
        <div class="row">
          <div class="col">
            <label class="field-label" for="field-id">ID</label>
            <input type="text" id="field-id" name="id" readonly />
            <div class="hint">Policy ID</div>
          </div>
          <div class="col">
            <label class="field-label" for="field-name">Name</label>
            <input type="text" id="field-name" name="name"/>
          </div>
        </div>

        <!-- row: Source IP, Source User, Destination IP -->
        <div class="row">
          <div class="col">
            <label class="field-label" for="field-srcip">Source IP</label>
            <textarea id="field-srcip" name="srcip"></textarea>
          </div>

          <div class="col">
            <label class="field-label" for="field-srcuser">Source User</label>
            <textarea id="field-srcuser" name="srcuser"></textarea>
          </div>

          <div class="col">
            <label class="field-label" for="field-dstip">Destination IP</label>
            <textarea id="field-dstip" name="dstip"></textarea>
          </div>
        </div>

        <!-- row: Domains, TCP, UDP -->
        <div class="row">
          <div class="col">
            <label class="field-label" for="field-domains">Domains</label>
            <textarea id="field-domains" name="domains"></textarea>
          </div>

          <div class="col">
            <label class="field-label" for="field-tcp">TCP Ports</label>
            <textarea id="field-tcp" name="tcp_ports"></textarea>
          </div>

          <div class="col">
            <label class="field-label" for="field-udp">UDP Ports</label>
            <textarea id="field-udp" name="udp_ports"></textarea>
          </div>
        </div>

        <!-- row: ICMP, Action, Disabled -->
        <div class="row">
          <div class="col" style="min-width:180px;">
            <label class="field-label">ICMP</label>
            <div class="radio-group" role="radiogroup" aria-label="ICMP">
              <label class="radio-option" id="icmp-true-label">
                <input type="radio" name="icmp" id="icmp-true" value="true"> TRUE
              </label>
              <label class="radio-option" id="icmp-false-label">
                <input type="radio" name="icmp" id="icmp-false" value="false"> FALSE
              </label>
            </div>
          </div>

          <div class="col" style="min-width:180px;">
            <label class="field-label">Action</label>
            <div class="radio-group" role="radiogroup" aria-label="Action">
              <label class="radio-option" id="action-allow-label">
                <input type="radio" name="action" id="action-allow" value="allow"> ALLOW
              </label>
              <label class="radio-option" id="action-drop-label">
                <input type="radio" name="action" id="action-drop" value="drop"> DROP
              </label>
            </div>
          </div>

          <div class="col" style="min-width:180px;">
            <label class="field-label">Disabled</label>
            <div class="radio-group" role="radiogroup" aria-label="Disabled">
              <label class="radio-option" id="disabled-true-label">
                <input type="radio" name="disabled" id="disabled-true" value="true"> TRUE
              </label>
              <label class="radio-option" id="disabled-false-label">
                <input type="radio" name="disabled" id="disabled-false" value="false"> FALSE
              </label>
            </div>
          </div>
        </div>

        <!-- row: schedule -->
        <div class="row">
          <div class="col" style="flex:0.6;">
            <label class="field-label" for="field-schedule">Schedule (dd/mm/yyyy)</label>
            <input type="text" id="field-schedule" name="schedule"/>
          </div>
        </div>

        <!-- actions -->
        <div class="form-actions">
          <button id="deleteBtn" class="btn btn-danger" type="button">DELETE</button>
          <button id="editBtn" class="btn btn-accent" type="button">EDIT</button>
        </div>
      </form>
    </section>
  </main>

  <script>
    // small helper utilities
    const $ = (sel, root=document) => root.querySelector(sel);
    const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));
    const statusEl = $('#status');

    function showStatus(message, ok=true, timeout=4000) {
      statusEl.textContent = message;
      statusEl.className = 'status show ' + (ok ? 'ok' : 'err');
      if (timeout) {
        setTimeout(() => {
          statusEl.className = 'status';
        }, timeout);
      }
    }

    // USER DROPDOWN logic
    const userBtn = $('#userBtn');
    const userDropdown = $('#userDropdown');
    userBtn.addEventListener('click', (e) => {
      const showing = userDropdown.classList.toggle('show');
      userDropdown.setAttribute('aria-hidden', (!showing).toString());
      userBtn.setAttribute('aria-expanded', showing.toString());
    });
    document.addEventListener('click', (e) => {
      if (!userBtn.contains(e.target) && !userDropdown.contains(e.target)) {
        userDropdown.classList.remove('show');
        userDropdown.setAttribute('aria-hidden', 'true');
        userBtn.setAttribute('aria-expanded', 'false');
      }
    });

    // helper: parse query param
    function getQueryParam(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name);
    }

    // helper: parse lines into array (trim, remove empty)
    function linesToArray(multilines) {
      if (!multilines) return [];
      return multilines.split(/\r?\n/).map(s => s.trim()).filter(s => s.length > 0);
    }

    // helper: parse ports into int array or null
    function parsePortLines(lines) {
      const arr = linesToArray(lines);
      const ints = arr.map(s => {
        const n = Number(s.trim());
        return Number.isFinite(n) ? Math.trunc(n) : null;
      }).filter(x => x !== null);
      return ints.length ? ints : [];
    }

    // helper: convert dd/mm/yyyy to yyyy-mm-dd (or null)
    function ddmmyyyyToISO(dateStr) {
      if (!dateStr) return "";
      const m = dateStr.trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
      if (!m) return "";
      const day = m[1].padStart(2,'0');
      const month = m[2].padStart(2,'0');
      const year = m[3];
      return `${year}-${month}-${day}`; // ISO date
    }

    // fill radio active classes for UX
    function attachRadioStyling() {
      $$('label.radio-option').forEach(lbl => {
        const input = lbl.querySelector('input[type="radio"]');
        if (!input) return;
        input.addEventListener('change', () => {
          const group = input.name;
          $$(`label.radio-option`).filter(l => l.querySelector('input') && l.querySelector('input').name === group)
            .forEach(l => l.classList.remove('active'));
          if (input.checked) lbl.classList.add('active');
        });
      });
    }

    attachRadioStyling();

    // Populate the form from a policy object
    function populateForm(policy) {
      if (!policy) return;
      $('#field-id').value = (policy.id !== undefined && policy.id !== null) ? String(policy.id) : '';
      $('#field-name').value = policy.name || '';

      // arrays stored as arrays on the policy object; if backend returns text, handle that too
      const srcip = Array.isArray(policy.srcip) ? policy.srcip.join('\n') : (policy.srcip || '');
      $('#field-srcip').value = srcip;

      const srcuser = Array.isArray(policy.srcuser) ? policy.srcuser.join('\n') : (policy.srcuser || '');
      $('#field-srcuser').value = srcuser;

      const dstip = Array.isArray(policy.dstip) ? policy.dstip.join('\n') : (policy.dstip || '');
      $('#field-dstip').value = dstip;

      const domains = Array.isArray(policy.domains) ? policy.domains.join('\n') : (policy.domains || '');
      $('#field-domains').value = domains;

      // tcp_ports and udp_ports may be arrays of numbers
      const tcp = Array.isArray(policy.tcp_ports) ? policy.tcp_ports.join('\n') : (policy.tcp_ports || '');
      $('#field-tcp').value = tcp;

      const udp = Array.isArray(policy.udp_ports) ? policy.udp_ports.join('\n') : (policy.udp_ports || '');
      $('#field-udp').value = udp;

      // icmp boolean
      const icmpVal = policy.icmp === true || String(policy.icmp) === 'true' ? 'true' : 'false';
      const icmpRadio = $(`#icmp-${icmpVal}`);
      if (icmpRadio) { icmpRadio.checked = true; icmpRadio.dispatchEvent(new Event('change')); }

      // action: boolean in DB (true=allow). Backend might return boolean or strings.
      let actionVal = 'drop';
      if (policy.action === true || String(policy.action).toLowerCase() === 'true' || String(policy.action).toLowerCase() === 'allow') {
        actionVal = 'allow';
      }
      const actionRadio = $(`#action-${actionVal}`);
      if (actionRadio) { actionRadio.checked = true; actionRadio.dispatchEvent(new Event('change')); }

      // disabled
      const disabledVal = policy.disabled === true || String(policy.disabled) === 'true' ? 'true' : 'false';
      const disabledRadio = $(`#disabled-${disabledVal}`);
      if (disabledRadio) { disabledRadio.checked = true; disabledRadio.dispatchEvent(new Event('change')); }

      // schedule: if ISO (yyyy-mm-dd) convert to dd/mm/yyyy for display
      let scheduleDisplay = '';
      if (policy.schedule) {
        // accept either ISO or dd/mm/yyyy string
        const iso = String(policy.schedule).trim();
        const mIso = iso.match(/^(\d{4})-(\d{2})-(\d{2})/);
        if (mIso) {
          scheduleDisplay = `${mIso[3]}/${mIso[2]}/${mIso[1]}`;
        } else {
          scheduleDisplay = iso; // fallback
        }
      }
      $('#field-schedule').value = scheduleDisplay;
    }

    // On load: fetch the policy using id query param
    async function loadPolicy() {
      const id = getQueryParam('id');
      if (!id) {
        showStatus('No id query parameter provided in URL. Example: /edit?id=123', false, 7000);
        return;
      }

      // populate id early
      $('#field-id').value = id;

      // Build query for backend as specified: /list_policies?q=id = {id}
      const q = `id = ${id}`;
      try {
        const resp = await fetch(`/list_policies?q=${encodeURIComponent(q)}`, {
          method: 'POST',
          headers: { 'Accept': 'application/json' }
        });
        if (!resp.ok) {
          showStatus('Failed to fetch policy: ' + resp.statusText, false);
          return;
        }
        const json = await resp.json();

        // Expect either { results: [ ... ] } or { count, results } or single object
        let policy = null;
        if (Array.isArray(json.results) && json.results.length) {
          policy = json.results[0];
        } else if (Array.isArray(json) && json.length) {
          policy = json[0];
        } else if (json && typeof json === 'object' && json.id !== undefined) {
          policy = json;
        } else if (json && json.results && json.results.length === 0) {
          showStatus('No policy found for id=' + id, false);
        } else {
          showStatus('Unexpected response from server when fetching policy.', false);
          console.debug('list_policies response', json);
        }

        if (policy) {
          populateForm(policy);
          showStatus('Policy loaded', true, 2000);
        }
      } catch (err) {
        console.error(err);
        showStatus('Error fetching policy: ' + err.message, false, 7000);
      }
    }

    // Build payload for edit
    function buildEditPayload() {
      const idRaw = $('#field-id').value.trim();
      const id = idRaw ? Number(idRaw) : null;
      if (!id || !Number.isFinite(id)) {
        throw new Error('Invalid id value.');
      }

      const name = $('#field-name').value.trim();
      if (!name) {
        throw new Error('Name is required.');
      }

      // arrays
      const srcip = linesToArray($('#field-srcip').value);
      const srcuser = linesToArray($('#field-srcuser').value);
      const dstip = linesToArray($('#field-dstip').value);
      const domains = linesToArray($('#field-domains').value);

      const tcp_ports = parsePortLines($('#field-tcp').value); // integer[] or null
      const udp_ports = parsePortLines($('#field-udp').value); // integer[] or null

      const icmpVal = $('input[name="icmp"]:checked')?.value === 'true';
      const actionRaw = $('input[name="action"]:checked')?.value || 'drop';
      const action = (String(actionRaw).toLowerCase() === 'allow' || String(actionRaw).toLowerCase() === 'true');

      const disabled = $('input[name="disabled"]:checked')?.value === 'true';

      const scheduleISO = ddmmyyyyToISO($('#field-schedule').value.trim()); // yyyy-mm-dd or null

      // Compose payload matching DB constraints (keys named per spec)
      const payload = {
        id: id,
        name: name,
        srcip: srcip,
        srcuser: srcuser,
        dstip: dstip,
        tcp_ports: tcp_ports,
        udp_ports: udp_ports,
        icmp: !!icmpVal,
        action: !!action,
        disabled: !!disabled,
        schedule: scheduleISO, // may be null
        domains: domains
      };

      // remove keys with null to avoid overriding intentionally
      Object.keys(payload).forEach(k => {
        if (payload[k] === null) delete payload[k];
      });

      return payload;
    }

    // EDIT handler
    $('#editBtn').addEventListener('click', async () => {
      try {
        const payload = buildEditPayload();
        showStatus('Sending update...', true, 0);

        const resp = await fetch('/edit_policy', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!resp.ok) {
          let msg = 'Server error: ' + resp.status;
          try { const j = await resp.json(); if (j && j.error) msg = j.error; } catch(e){}
          showStatus('Edit failed: ' + msg, false, 7000);
          return;
        }

        const j = await resp.json().catch(()=>null);
        showStatus('Policy updated successfully', true, 3000);
        // optional: if backend returns a redirect or message, handle here
        // keep form populated; do not redirect automatically
      } catch (err) {
        console.error(err);
        showStatus('Edit failed: ' + err.message, false, 7000);
      }
    });

    // DELETE handler
    $('#deleteBtn').addEventListener('click', async () => {
      const idRaw = $('#field-id').value.trim();
      if (!idRaw) {
        showStatus('Missing policy id.', false, 4000);
        return;
      }
      const id = Number(idRaw);
      if (!Number.isFinite(id)) {
        showStatus('Invalid policy id.', false, 4000);
        return;
      }

      if (!confirm(`Are you sure you want to delete policy id=${id}? This action cannot be undone.`)) {
        return;
      }

      try {
        showStatus('Sending delete request...', true, 0);
        const resp = await fetch('/delete_policy', {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({ id: id })
        });

        if (!resp.ok) {
          let msg = 'Server error: ' + resp.status;
          try { const j = await resp.json(); if (j && j.error) msg = j.error; } catch(e){}
          showStatus('Delete failed: ' + msg, false, 7000);
          return;
        }

        showStatus('Policy deleted. Redirecting...', true, 1500);
        setTimeout(() => {
          window.location.href = '/dashboard';
        }, 1200);
      } catch (err) {
        console.error(err);
        showStatus('Delete failed: ' + err.message, false, 7000);
      }
    });

    // initialize radio active classes present state
    function initRadioStates() {
      $$('label.radio-option').forEach(lbl => {
        const input = lbl.querySelector('input[type="radio"]');
        if (input && input.checked) lbl.classList.add('active');
        input?.addEventListener('change', () => {
          const grp = input.name;
          $$('label.radio-option').forEach(l => {
            const inp = l.querySelector('input[type="radio"]');
            if (inp && inp.name === grp) l.classList.remove('active');
          });
          if (input.checked) lbl.classList.add('active');
        });
      });
    }

    initRadioStates();

    // load policy on page load
    window.addEventListener('DOMContentLoaded', () => {
      loadPolicy();
    });

    // small UX: prevent accidental form submission via Enter
    document.getElementById('policyForm').addEventListener('submit', (e) => e.preventDefault());
  </script>
</body>
</html>
