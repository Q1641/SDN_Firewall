<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SDN Firewall — Policy</title>

  <!-- Inline styles for portability (dark theme as requested) -->

  <style>
    :root{
      --bg:#0e1726;
      --panel:#1e293b;
      --accent:#2563eb;
      --muted:#94a3b8;
      --text:#e6eef8;
      --danger:#ef4444;
      --radius:8px;
    }

    html,body{
      height:100%;
      margin:0;
      font-family: Inter, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background:var(--bg);
      color:var(--text);
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    /* Top fixed header */
    header.topbar{
      position:fixed;
      top:0;
      left:0;
      right:0;
      height:64px;
      background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.02));
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 20px;
      z-index:1000;
      border-bottom:1px solid rgba(255,255,255,0.03);
      backdrop-filter: blur(4px);
    }

    /* Left nav */
    .nav-left{
      display:flex;
      align-items:center;
      gap:20px;
    }
    .brand{
      font-weight:600;
      letter-spacing:0.2px;
      color:var(--text);
      margin-right:12px;
      font-size:16px;
    }
    nav.tabs{
      display:flex;
      gap:8px;
      align-items:center;
    }
    nav.tabs a.tab{
      padding:10px 14px;
      border-radius:6px;
      text-decoration:none;
      color:var(--muted);
      font-size:14px;
      display:inline-block;
    }
    nav.tabs a.tab.active{
      background:linear-gradient(90deg, rgba(37,99,235,0.12), rgba(37,99,235,0.06));
      color:var(--accent);
      box-shadow: 0 1px 0 rgba(255,255,255,0.02) inset;
      border:1px solid rgba(37,99,235,0.12);
    }

    /* Right user menu */
    .user-area{
      position:relative;
      display:flex;
      align-items:center;
      gap:12px;
    }
    .user-btn{
      background:transparent;
      border:1px solid rgba(255,255,255,0.03);
      padding:8px 10px;
      border-radius:12px;
      cursor:pointer;
      display:flex;
      gap:8px;
      align-items:center;
      color:var(--text);
      font-size:13px;
    }
    .user-btn:hover{ filter:brightness(0.95); }
    .user-dropdown{
      position:absolute;
      right:0;
      top:calc(100% + 8px);
      background:var(--panel);
      border-radius:8px;
      box-shadow:0 8px 30px rgba(2,6,23,0.6);
      min-width:170px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,0.03);
      display:none;
      z-index:1200;
    }
    .user-dropdown.show{ display:block; }
    .user-dropdown button{
      width:100%;
      background:transparent;
      border:none;
      padding:10px 14px;
      text-align:left;
      color:var(--text);
      cursor:pointer;
      font-size:14px;
    }
    .user-dropdown button:hover{ background:rgba(255,255,255,0.02); }

    /* Main content area */
    main.container{
      padding:88px 20px 40px;
      max-width:1200px;
      margin:0 auto;
      box-sizing:border-box;
    }

    /* Panel for policy list */
    .panel{
      background:var(--panel);
      border-radius:12px;
      padding:16px;
      box-shadow: 0 6px 20px rgba(2,6,23,0.6);
      border:1px solid rgba(255,255,255,0.03);
    }

    /* Header row for panel */
    .panel-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      margin-bottom:12px;
    }
    .panel-title{
      font-size:16px;
      font-weight:600;
      color:var(--text);
    }
    .panel-sub{
      color:var(--muted);
      font-size:13px;
    }

    /* Column selector dropdown (top-right above table) */
    .col-selector{
      position:relative;
      display:inline-block;
    }
    .col-selector .col-btn{
      background:transparent;
      border:1px solid rgba(255,255,255,0.04);
      padding:8px 10px;
      border-radius:10px;
      cursor:pointer;
      font-size:13px;
      color:var(--text);
    }
    .col-dropdown{
      position:absolute;
      right:0;
      top:calc(100% + 8px);
      min-width:220px;
      background:var(--panel);
      border-radius:10px;
      border:1px solid rgba(255,255,255,0.03);
      box-shadow: 0 8px 20px rgba(2,6,23,0.6);
      padding:10px;
      display:none;
      z-index:1100;
    }
    .col-dropdown.show{ display:block; }
    .col-dropdown label{
      display:flex;
      align-items:center;
      gap:8px;
      padding:6px 4px;
      cursor:pointer;
      font-size:13px;
      color:var(--text);
    }
    .col-dropdown input[type="checkbox"]{ transform:scale(1.05); }

    /* Table container with horizontal scroll only */
    .table-wrap{
      overflow-x:auto;
      border-radius:8px;
      margin-top:8px;
      -webkit-overflow-scrolling:touch;
    }
    table.policies{
      border-collapse:collapse;
      width:100%;
      min-width:1100px; /* allow scrollbar on smaller screens */
      table-layout:auto;
    }
    table.policies th, table.policies td{
      padding:10px 12px;
      text-align:left;
      border-bottom:1px solid rgba(255,255,255,0.03);
      font-size:13px;
      vertical-align:middle;
      color:var(--text);
      white-space:nowrap;
    }
    table.policies thead th{
      background:linear-gradient(90deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      position:sticky;
      top:0;
      z-index:2;
      color:var(--muted);
      font-weight:600;
      font-size:12px;
      text-transform:uppercase;
      letter-spacing:0.6px;
    }

    /* Column sizing utilities */
    .small{ width:72px; max-width:160px; overflow:hidden; text-overflow:ellipsis; }
    .medium{ width:120px; max-width:260px; overflow:hidden; text-overflow:ellipsis; }

    /* Action classes */
    .action-allow{ color:var(--accent); font-weight:600; }
    .action-deny{ color:var(--danger); font-weight:700; }

    /* Disabled row styling */
    .disabled-row{
      opacity:0.5;
      font-style:italic;
      filter:grayscale(0.15);
    }

    /* Edit button */
    .edit-btn{
      background:transparent;
      border:1px solid rgba(255,255,255,0.04);
      padding:6px 8px;
      border-radius:8px;
      cursor:pointer;
      font-size:13px;
      color:var(--text);
    }
    .edit-btn:hover{ background:rgba(255,255,255,0.02); }

    /* Small helpers */
    .muted{ color:var(--muted); font-size:13px; }
    .center{ text-align:center; }

    /* Responsive adjustments */
    @media (max-width:720px){
      main.container{ padding:88px 12px 20px; }
      table.policies th, table.policies td{ padding:8px 10px; font-size:12px; }
    }
  </style>

</head>
<body>
  <!-- Top navigation / header -->
  <header class="topbar" role="banner" aria-label="Top navigation">
    <div class="nav-left" role="navigation" aria-label="Main">
      <div class="brand">SDN Firewall</div>
      <nav class="tabs" role="tablist" aria-label="Primary tabs">
      </nav>
    </div>

<div class="user-area">
  <div class="muted" style="font-size:13px;">Admin</div>
  <button class="user-btn" id="userBtn" aria-haspopup="true" aria-expanded="false" title="User menu">
    <span style="font-size:16px;">👤</span>
    <span style="opacity:0.9;">Account</span>
  </button>

  <div class="user-dropdown" id="userDropdown" role="menu" aria-hidden="true">
    <button id="changePasswordBtn" type="button" role="menuitem">Change Password</button>
    <button id="logoutBtn" type="button" role="menuitem">Logout</button>
  </div>
</div>

  </header>

  <!-- Main content -->

  <main class="container" role="main">
    <div class="panel" aria-labelledby="policyTitle">
      <div class="panel-header">
        <div>
          <div id="policyTitle" class="panel-title">Policy Management</div>
          <div class="panel-sub">View and manage firewall policies for the SDN environment.</div>
        </div>

    <!-- Column selector (top-right above table) -->
    <div class="col-selector" id="colSelectorWrap">
      <button class="col-btn" id="colToggleBtn" aria-haspopup="true" aria-expanded="false" title="Toggle columns">☰ Columns</button>
      <div class="col-dropdown" id="colDropdown" aria-hidden="true">
        <!-- Checkboxes generated by JS to ensure consistent ordering -->
        <label><input type="checkbox" data-col="id" checked /> ID</label>
        <label><input type="checkbox" data-col="name" checked /> Name</label>
        <label><input type="checkbox" data-col="srcip" checked /> Source IP</label>
        <label><input type="checkbox" data-col="srcuser" checked /> Source User</label>
        <label><input type="checkbox" data-col="dstip" checked /> Destination IP</label>
        <label><input type="checkbox" data-col="tcp_ports" checked /> TCP</label>
        <label><input type="checkbox" data-col="udp_ports" checked /> UDP</label>
        <label><input type="checkbox" data-col="icmp" checked /> ICMP</label>
        <label><input type="checkbox" data-col="action" checked /> Action</label>
        <label><input type="checkbox" data-col="schedule" checked /> Schedule</label>
        <label><input type="checkbox" data-col="edit" checked /> Edit</label>
      </div>
    </div>
  </div>

  <!-- Table area with horizontal scrolling only -->
  <div class="table-wrap" id="tableWrap" role="region" aria-label="Policy table">
    <table class="policies" id="policiesTable" aria-describedby="policyTitle">
      <thead>
        <tr>
          <th class="small col-id">ID</th>
          <th class="col-name">Name</th>
          <th class="col-srcip">Source IP</th>
          <th class="col-srcuser">Source User</th>
          <th class="col-dstip">Destination IP</th>
          <th class="medium col-tcp_ports">TCP</th>
          <th class="medium col-udp_ports">UDP</th>
          <th class="small col-icmp">ICMP</th>
          <th class="small col-action">Action</th>
          <th class="col-schedule">Schedule</th>
          <th class="medium col-edit">Edit</th>
        </tr>
      </thead>
      <tbody id="policiesTbody">
        <!-- Rows created dynamically by JS -->
        <tr id="loadingRow">
          <td class="center" colspan="11" style="padding:20px 12px; color:var(--muted);">Loading policies...</td>
        </tr>
      </tbody>
    </table>
  </div>

</div>

  </main>

  <!-- Inline script - vanilla JS only -->

  <script>
    /* Helper: safe text for insertion (prevents accidental HTML injection) */
    function escapeHtml(s) {
      if (s === null || s === undefined) { return ""; }
      return String(s).replace(/[&<>"'`=\/]/g, function (c) {
        return {
          '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','/':'&#x2F;','=':'&#x3D;','`':'&#x60;'
        }[c];
      });
    }

    /* Format lists (arrays or comma separated strings) into readable string */
    function formatList(v) {
      if (v === null || v === undefined) { return ""; }
      if (Array.isArray(v)) {
        return escapeHtml(v.join(", "));
      }
      // if it's a string that looks like comma-separated
      if (typeof v === "string") {
        return escapeHtml(v);
      }
      try {
        // fallback: convert to string
        return escapeHtml(String(v));
      } catch (e) {
        return "";
      }
    }

    /* Build table row HTML for a policy object */
    function buildRowHtml(p) {
      var rowClass = (p.disabled ? "disabled-row" : "");
      var actionClass = (p.action ? "action-allow" : "action-deny");
      var icmpMark = (p.icmp ? "✓" : "");
      var html = "<tr class='" + rowClass + "' data-id='" + escapeHtml(p.id) + "'>";
      html += "<td class='small col-id'>" + escapeHtml(p.id || "") + "</td>";
      html += "<td class='col-name'>" + escapeHtml(p.name || "") + "</td>";
      html += "<td class='col-srcip'>" + formatList(p.srcip) + "</td>";
      html += "<td class='col-srcuser'>" + formatList(p.srcuser) + "</td>";
      html += "<td class='col-dstip'>" + formatList(p.dstip) + "</td>";
      html += "<td class='medium col-tcp_ports'>" + formatList(p.tcp_ports) + "</td>";
      html += "<td class='medium col-udp_ports'>" + formatList(p.udp_ports) + "</td>";
      html += "<td class='small col-icmp'>" + icmpMark + "</td>";
      html += "<td class='small col-action " + actionClass + "'>" + (p.action ? "ALLOW" : "DENY") + "</td>";
      html += "<td class='col-schedule'>" + escapeHtml(p.schedule || "") + "</td>";
      html += "<td class='medium col-edit'><button class='edit-btn' data-id='" + escapeHtml(p.id) + "'>Edit</button></td>";
      html += "</tr>";
      return html;
    }

    /* Fetch policies from endpoint and populate table */
    function loadPolicies() {
      var tbody = document.getElementById("policiesTbody");
      // show loading row
      tbody.innerHTML = "<tr id='loadingRow'><td class='center' colspan='11' style='padding:20px 12px; color:var(--muted);'>Loading policies...</td></tr>";

      // GET /list_policies
      var request = new XMLHttpRequest();
      request.open("GET", "/list_policies", true);
      request.onreadystatechange = function() {
        if (request.readyState !== 4) { return; }
        if (request.status >= 200 && request.status < 300) {
          try {
            var policies = JSON.parse(request.responseText);
            renderPolicies(policies);
          } catch (e) {
            tbody.innerHTML = "<tr><td class='center' colspan='11' style='padding:20px 12px; color:var(--muted);'>Error parsing policy list.</td></tr>";
            console.error("Failed to parse /list_policies response:", e);
          }
        } else {
          tbody.innerHTML = "<tr><td class='center' colspan='11' style='padding:20px 12px; color:var(--muted);'>Failed to load policies (status " + request.status + ").</td></tr>";
        }
      };
      request.send(null);
    }

    /* Render policies array into the table body */
    function renderPolicies(policies) {
      var tbody = document.getElementById("policiesTbody");
      if (!policies || policies.length === 0) {
        tbody.innerHTML = "<tr><td class='center' colspan='11' style='padding:20px 12px; color:var(--muted);'>No policies configured.</td></tr>";
        return;
      }
      var html = "";
      for (var i = 0; i < policies.length; i++) {
        var p = policies[i];
        html += buildRowHtml(p);
      }
      tbody.innerHTML = html;

      // Attach click handlers for edit buttons
      var editBtns = tbody.querySelectorAll(".edit-btn");
      for (var i = 0; i < editBtns.length; i++) {
        editBtns[i].addEventListener("click", function (evt) {
          var id = this.getAttribute("data-id");
          // Current behavior: show an alert. In future: open modal or navigate to edit page.
          alert("Edit policy: " + id);
        });
      }
    }

    /* Column visibility toggle logic:
       Each checkbox has data-col attribute matching the class names used for the columns (e.g., col-id, col-name).
       Toggling will add/remove a CSS rule of display:none on matching elements.
    */
    function setupColumnSelector() {
      var colToggleBtn = document.getElementById("colToggleBtn");
      var colDropdown = document.getElementById("colDropdown");
      var colSelectorWrap = document.getElementById("colSelectorWrap");

      // open/close dropdown
      colToggleBtn.addEventListener("click", function (evt) {
        evt.stopPropagation();
        var isShown = colDropdown.classList.contains("show");
        if (isShown) {
          colDropdown.classList.remove("show");
          colToggleBtn.setAttribute("aria-expanded", "false");
          colDropdown.setAttribute("aria-hidden", "true");
        } else {
          colDropdown.classList.add("show");
          colToggleBtn.setAttribute("aria-expanded", "true");
          colDropdown.setAttribute("aria-hidden", "false");
        }
      });

      // checkbox toggles
      var checks = colDropdown.querySelectorAll('input[type="checkbox"][data-col]');
      for (var i = 0; i < checks.length; i++) {
        (function(cb){
          cb.addEventListener("change", function () {
            var col = cb.getAttribute("data-col");
            toggleColumnVisibility(col, cb.checked);
          });
        })(checks[i]);
      }

      // click outside to close
      document.addEventListener("click", function (evt) {
        if (!colSelectorWrap.contains(evt.target)) {
          colDropdown.classList.remove("show");
          colToggleBtn.setAttribute("aria-expanded", "false");
          colDropdown.setAttribute("aria-hidden", "true");
        }
      });
    }

    /* Show/hide elements by column key (col-id => .col-id) */
    function toggleColumnVisibility(colKey, visible) {
      var selector = ".col-" + colKey;
      var elements = document.querySelectorAll(selector);
      for (var i = 0; i < elements.length; i++) {
        elements[i].style.display = visible ? "" : "none";
      }

      // For headers, keep table layout stable; no further action needed.
    }

    /* User menu behavior and logout */
    function setupUserMenu() {
      var userBtn = document.getElementById("userBtn");
      var userDropdown = document.getElementById("userDropdown");
      var logoutBtn = document.getElementById("logoutBtn");
      var changePasswordBtn = document.getElementById("changePasswordBtn");

      userBtn.addEventListener("click", function (evt) {
        evt.stopPropagation();
        var show = userDropdown.classList.contains("show");
        if (show) {
          userDropdown.classList.remove("show");
          userDropdown.setAttribute("aria-hidden", "true");
          userBtn.setAttribute("aria-expanded", "false");
        } else {
          userDropdown.classList.add("show");
          userDropdown.setAttribute("aria-hidden", "false");
          userBtn.setAttribute("aria-expanded", "true");
        }
      });

      // Close on outside click
      document.addEventListener("click", function (evt) {
        if (!userBtn.contains(evt.target) && !userDropdown.contains(evt.target)) {
          userDropdown.classList.remove("show");
          userDropdown.setAttribute("aria-hidden", "true");
          userBtn.setAttribute("aria-expanded", "false");
        }
      });

      changePasswordBtn.addEventListener("click", function () {
        // Navigate to change password page or show modal; we redirect for now
      });

      logoutBtn.addEventListener("click", function () {
        // Send POST /logout
        var xhr = new XMLHttpRequest();
        xhr.open("POST", "/logout", true);
        xhr.setRequestHeader("Content-Type", "application/json;charset=UTF-8");
        xhr.onreadystatechange = function () {
          if (xhr.readyState !== 4) { return; }
          if (xhr.status >= 200 && xhr.status < 300) {
            // On success, redirect to login page
          } else {
            alert("Logout failed (status " + xhr.status + ").");
          }
        };
        // send empty body (server should use session/cookie)
        xhr.send(JSON.stringify({}));
      });
    }

    /* Initialize: set default column visibility from checkboxes (in case table already loaded) */
    function initDefaultColumnVisibility() {
      var checks = document.querySelectorAll('#colDropdown input[type="checkbox"][data-col]');
      for (var i = 0; i < checks.length; i++) {
        var col = checks[i].getAttribute("data-col");
        toggleColumnVisibility(col, checks[i].checked);
      }
    }

    /* On DOM ready */
    (function () {
      try {
        setupColumnSelector();
        setupUserMenu();
        initDefaultColumnVisibility();
        loadPolicies();
      } catch (e) {
        console.error("Initialization error:", e);
      }
    })();

    /* Expose a reload function for convenience (global) */
    window.reloadPolicies = function() { loadPolicies(); };
  </script>

</body>
</html>
