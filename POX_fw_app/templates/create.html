<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Create Policy — Admin</title>

  <style>
/*
    :root{
      --bg:#0e1726;
      --panel:#1e293b;
      --panel-2:#1e293b;
      --muted:#94a3b8;
      --muted-2:#94a3b8;
      --accent:#2563eb;
      --danger:#ef4444;
      --radius:8px;
      --shadow: 0 8px 24px rgba(2,6,23,0.6);
      --glass: rgba(255,255,255,0.02);
      --max-width:900px;
    }
*/

    :root {
      --bg: #f9fafb;
      --panel: #ffffff;
      --panel-2: #f1f5f9;
      --muted: #475569;
      --muted-2: #64748b;
      --accent: #2563eb;
      --danger: #dc2626;
      --radius: 8px;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
      --glass: rgba(255, 255, 255, 0.8);
      --max-width: 900px;
    }

    html,body{
      height:100%;
      margin:0;
      font-family: Inter, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background:var(--bg);
      color:var(--muted);
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    /* NAVBAR */
    .navbar{
      position:fixed;
      top:0;
      left:0;
      right:0;
      height:64px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 18px;
      background:var(--panel);
      border-bottom:1px solid rgba(255,255,255,0.03);
      z-index:1200;
    }
    .nav-left{ display:flex; align-items:center; gap:18px; }
    .nav-brand{
      font-weight:600;
      color:var(--muted);
      font-size:16px;
      display:inline-block;
      padding-right:6px;
    }
    .nav-tabs{ display:flex; gap:8px; align-items:center; }
    .nav-tabs a{
      color:var(--muted-2);
      text-decoration:none;
      padding:8px 12px;
      border-radius:6px;
      font-size:14px;
      display:inline-flex;
      align-items:center;
    }
    .nav-tabs a:hover{ background:var(--glass); color:var(--muted); }
    .nav-tabs a.active{
      color:var(--muted);
      box-shadow: inset 0 -3px 0 var(--accent);
      position:relative;
      font-weight:600;
    }
    .nav-right{ display:flex; align-items:center; gap:12px; position:relative; }
    .user-btn{
      background:transparent;
      border:1px solid rgba(255,255,255,0.03);
      color:var(--muted);
      padding:8px 10px;
      border-radius:10px;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      gap:8px;
      font-size:13px;
    }
    .user-btn:focus{ outline:none; }
    .user-dropdown{
      position:absolute;
      right:0px;
      top:calc(100% + 8px);
      background:var(--panel-2);
      border-radius:8px;
      box-shadow:var(--shadow);
      min-width:180px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,0.03);
      display:none;
      z-index:1300;
    }
    .user-dropdown.show{ display:block; }
    .user-dropdown button{
      width:100%;
      background:transparent;
      border:none;
      text-align:left;
      padding:10px 12px;
      color:var(--muted);
      cursor:pointer;
      font-size:14px;
    }
    .user-dropdown button:hover{ background:rgba(255,255,255,0.02); }

    /* PAGE LAYOUT */
    main.page {
      padding: 92px 18px 40px;
      display:flex;
      justify-content:center;
    }
    .card {
      width:100%;
      max-width:var(--max-width);
      background: linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.00));
      border-radius:var(--radius);
      padding:20px;
      box-shadow:var(--shadow);
      border:1px solid rgba(255,255,255,0.02);
    }
    .card h1 {
      margin:0 0 8px 0;
      color:var(--muted);
      font-size:20px;
      font-weight:700;
    }
    .card p.lead {
      margin:0 0 18px 0;
      color:var(--muted-2);
      font-size:13px;
    }

    /* FORM LAYOUT */
    form.policy-form {
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    .row {
      display:flex;
      gap:12px;
      align-items:flex-start;
      flex-wrap:wrap;
    }
    .col {
      flex:1;
      min-width:220px;
    }
    label.field-label {
      display:block;
      font-size:13px;
      margin-bottom:6px;
      color:var(--muted-2);
      font-weight:600;
    }
    input[type="text"],
    input[readonly],
    textarea,
    select {
      width:100%;
      padding:10px 12px;
      background:transparent;
      border:1px solid rgba(255,255,255,0.04);
      border-radius:8px;
      color:var(--muted);
      font-size:14px;
      box-sizing:border-box;
    }
    input[readonly] {
      opacity:0.85;
      background:rgba(255,255,255,0.01);
    }
    textarea {
      resize:vertical;
      min-height:72px;
      max-height:280px;
    }

    /* radio groups */
    .radio-group {
      display:flex;
      gap:8px;
      align-items:center;
      flex-wrap:wrap;
    }
    .radio-option {
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 10px;
      border-radius:8px;
      border:1px solid rgba(255,255,255,0.03);
      cursor:pointer;
      background:transparent;
      color:var(--muted);
      font-size:13px;
    }
    .radio-option input {
      accent-color:var(--accent);
    }
    .radio-option.active {
      box-shadow: inset 0 -3px 0 var(--accent);
      color:var(--muted);
      font-weight:600;
      background:var(--panel-2);
    }

    /* foot actions */
    .form-actions {
      display:flex;
      gap:12px;
      justify-content:flex-end;
      align-items:center;
      margin-top:8px;
    }
    button.btn {
      padding:10px 14px;
      border-radius:8px;
      border:none;
      cursor:pointer;
      font-weight:700;
      font-size:14px;
    }
    button.btn:active { transform:translateY(1px); }
    .btn-danger {
      background: linear-gradient(180deg, #f43f3f, #e03131);
      color: #fff;
      box-shadow: 0 6px 18px rgba(228,43,43,0.18);
    }
    .btn-accent {
      background: linear-gradient(180deg, var(--accent), #0062d6);
      color: #fff;
      box-shadow: 0 6px 18px rgba(37,99,235,0.14);
    }
    .btn-ghost {
      background:transparent;
      border:1px solid rgba(255,255,255,0.04);
      color:var(--muted);
    }

    /* helper text */
    .hint {
      font-size:12px;
      color:var(--muted-2);
      margin-top:6px;
    }

    /* responsive tweaks */
    @media (max-width:820px){
      .row { flex-direction:column; }
      .form-actions { justify-content:stretch; flex-direction:column-reverse; gap:8px; }
      .form-actions button { width:100%; }
    }

    /* small status message */
    .status {
      padding:10px 12px;
      border-radius:8px;
      font-size:13px;
      display:none;
    }
    .status.show { display:block; }
    .status.ok { background: rgba(37,99,235,0.08); color:var(--muted); border:1px solid rgba(37,99,235,0.06); }
    .status.err { background: rgba(239,68,68,0.06); color:var(--muted); border:1px solid rgba(239,68,68,0.06); }

  </style>

</head>
<body>
  <!-- NAV -->
  <header class="navbar" role="banner">
    <div class="nav-left">
      <div class="nav-brand">SDN Firewall</div>
      <nav class="nav-tabs" role="navigation" aria-label="Main">
        <a href="/logs">Log</a>
        <a href="/dashboard" class="active">Policy</a>
      </nav>
    </div>

<div class="nav-right">
  <button class="user-btn" id="userBtn" aria-haspopup="true" aria-expanded="false" title="Account menu">
        <span aria-hidden="true" style="display:inline-block; width:16px; height:16px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 12c2.761 0 5-2.239 5-5s-2.239-5-5-5-5 2.239-5 5 2.239 5 5 5z" fill="currentColor" />
            <path d="M4 20c0-3.314 2.686-6 6-6h4c3.314 0 6 2.686 6 6v1H4v-1z" fill="currentColor" />
        </svg>
        </span>
    </button>

  <div class="user-dropdown" id="userDropdown" role="menu" aria-hidden="true">
    <button id="logoutBtn" role="menuitem">Logout</button>
    <button id="changePwBtn" role="menuitem">Change Password</button>
  </div>
</div>
  </header>

  <main class="page" role="main">
    <section class="card" aria-labelledby="createTitle">
      <h1 id="createTitle">Create Policy</h1>
      <p class="lead">Add a new firewall policy. Fields with multiple entries accept one item per line.</p>
  <div id="status" class="status" role="status" aria-live="polite"></div>

  <form id="policyForm" class="policy-form" onsubmit="return false;">
    <!-- top row: name and order_index -->
    <div class="row">
      <div class="col">
        <label class="field-label" for="field-name">Policy Name</label>
        <input type="text" id="field-name" name="name" placeholder="" />
      </div>
      <div class="col">
        <label class="field-label" for="field-order">Order Index</label>
        <input type="text" id="field-order" name="order_index" placeholder="" />
      </div>
    </div>

    <!-- row: Source IP, Source User, Destination IP -->
    <div class="row">
      <div class="col">
        <label class="field-label" for="field-srcip">Source IP</label>
        <textarea id="field-srcip" name="srcip" placeholder=""></textarea>
      </div>

      <div class="col">
        <label class="field-label" for="field-srcuser">Source User</label>
        <textarea id="field-srcuser" name="srcuser" placeholder=""></textarea>
      </div>

      <div class="col">
        <label class="field-label" for="field-dstip">Destination IP</label>
        <textarea id="field-dstip" name="dstip" placeholder=""></textarea>
      </div>
    </div>

    <!-- row: Domains, TCP, UDP -->
    <div class="row">
      <div class="col">
        <label class="field-label" for="field-domains">Domains</label>
        <textarea id="field-domains" name="domains" placeholder=""></textarea>
      </div>

      <div class="col">
        <label class="field-label" for="field-tcp">TCP Ports</label>
        <textarea id="field-tcp" name="tcp_ports" placeholder=""></textarea>
      </div>

      <div class="col">
        <label class="field-label" for="field-udp">UDP Ports</label>
        <textarea id="field-udp" name="udp_ports" placeholder=""></textarea>
      </div>
    </div>

    <!-- row: ICMP, Action, Disabled -->
    <div class="row">
      <div class="col" style="min-width:180px;">
        <label class="field-label">ICMP</label>
        <div class="radio-group" role="radiogroup" aria-label="ICMP">
          <label class="radio-option" id="icmp-true-label">
            <input type="radio" name="icmp" id="icmp-true" value="true"> TRUE
          </label>
          <label class="radio-option" id="icmp-false-label">
            <input type="radio" name="icmp" id="icmp-false" value="false"> FALSE
          </label>
        </div>
      </div>

      <div class="col" style="min-width:180px;">
        <label class="field-label">Action</label>
        <div class="radio-group" role="radiogroup" aria-label="Action">
          <label class="radio-option" id="action-allow-label">
            <input type="radio" name="action" id="action-allow" value="allow"> ALLOW
          </label>
          <label class="radio-option" id="action-drop-label">
            <input type="radio" name="action" id="action-drop" value="drop"> DROP
          </label>
        </div>
      </div>

      <div class="col" style="min-width:180px;">
        <label class="field-label">Disabled</label>
        <div class="radio-group" role="radiogroup" aria-label="Disabled">
          <label class="radio-option" id="disabled-true-label">
            <input type="radio" name="disabled" id="disabled-true" value="true"> TRUE
          </label>
          <label class="radio-option" id="disabled-false-label">
            <input type="radio" name="disabled" id="disabled-false" value="false"> FALSE
          </label>
        </div>
      </div>
    </div>

    <!-- row: schedule -->
    <div class="row">
      <div class="col" style="flex:0.6;">
        <label class="field-label" for="field-schedule">Schedule (dd/mm/yyyy)</label>
        <input type="text" id="field-schedule" name="schedule" placeholder="" />
        <div class="hint">Leave blank for no schedule.</div>
      </div>
    </div>

    <!-- actions -->
    <div class="form-actions">
      <button id="createBtn" class="btn btn-accent" type="button">CREATE</button>
    </div>
  </form>
</section>
  </main>
  <script>
    // Utilities
    const $ = (sel, root=document) => root.querySelector(sel);
    const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));
    const statusEl = $('#status');

    function showStatus(message, ok=true, timeout=4000) {
      statusEl.textContent = message;
      statusEl.className = 'status show ' + (ok ? 'ok' : 'err');
      if (timeout) {
        setTimeout(() => {
          statusEl.className = 'status';
        }, timeout);
      }
    }

    // User dropdown
    const userBtn = $('#userBtn');
    const userDropdown = $('#userDropdown');
    userBtn.addEventListener('click', () => {
      const showing = userDropdown.classList.toggle('show');
      userDropdown.setAttribute('aria-hidden', (!showing).toString());
      userBtn.setAttribute('aria-expanded', showing.toString());
    });
    document.addEventListener('click', (e) => {
      if (!userBtn.contains(e.target) && !userDropdown.contains(e.target)) {
        userDropdown.classList.remove('show');
        userDropdown.setAttribute('aria-hidden', 'true');
        userBtn.setAttribute('aria-expanded', 'false');
      }
    });

    // Parse multiline text into array (trim and remove empties)
    function linesToArray(multilines) {
      if (!multilines) return [];
      return multilines.split(/\r?\n/).map(s => s.trim()).filter(s => s.length > 0);
    }

    // Parse ports to integer array (returns [] if none)
    function parsePortLines(lines) {
      const arr = linesToArray(lines);
      const ints = arr.map(s => {
        const n = Number(s.trim());
        return Number.isFinite(n) ? Math.trunc(n) : null;
      }).filter(x => x !== null);
      return ints;
    }

    // Convert dd/mm/yyyy to yyyy-mm-dd or return empty string for none/invalid
    function ddmmyyyyToISO(dateStr) {
      if (!dateStr) return "";
      const m = dateStr.trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
      if (!m) return "";
      const day = m[1].padStart(2,'0');
      const month = m[2].padStart(2,'0');
      const year = m[3];
      return `${year}-${month}-${day}`;
    }

    // Radio styling
    function attachRadioStyling() {
      $$('label.radio-option').forEach(lbl => {
        const input = lbl.querySelector('input[type="radio"]');
        if (!input) return;
        input.addEventListener('change', () => {
          const group = input.name;
          $$('label.radio-option').forEach(l => {
            const inp = l.querySelector('input[type="radio"]');
            if (inp && inp.name === group) l.classList.remove('active');
          });
          if (input.checked) lbl.classList.add('active');
        });
      });
    }
    attachRadioStyling();

    // Set default values for radios per spec:
    // ICMP -> FALSE, Action -> ALLOW, Disabled -> FALSE
    function setDefaultRadios() {
      const icmpFalse = $('#icmp-false');
      const actionAllow = $('#action-allow');
      const disabledFalse = $('#disabled-false');

      if (icmpFalse) {
        icmpFalse.checked = true;
        icmpFalse.dispatchEvent(new Event('change'));
      }
      if (actionAllow) {
        actionAllow.checked = true;
        actionAllow.dispatchEvent(new Event('change'));
      }
      if (disabledFalse) {
        disabledFalse.checked = true;
        disabledFalse.dispatchEvent(new Event('change'));
      }
    }
    setDefaultRadios();

    // Prevent Enter from submitting the form
    document.getElementById('policyForm').addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) {
        // allow Enter in textarea; but prevent accidental submit from single-line inputs
        if (e.target.tagName === 'INPUT') {
          e.preventDefault();
        }
      }
    });
    document.getElementById('policyForm').addEventListener('submit', (e) => e.preventDefault());

    // Build payload for create
    function buildCreatePayload() {
      const name = $('#field-name').value.trim();
      const orderIdxRaw = $('#field-order').value.trim();

      if (!name) {
        throw new Error('Please fill in all required fields.');
      }
      const order_index_num = Number(orderIdxRaw);
      const srcip = linesToArray($('#field-srcip').value);
      const srcuser = linesToArray($('#field-srcuser').value);
      const dstip = linesToArray($('#field-dstip').value);
      const domains = linesToArray($('#field-domains').value);
      const tcp_ports = parsePortLines($('#field-tcp').value);
      const udp_ports = parsePortLines($('#field-udp').value);

      const icmp = $('input[name="icmp"]:checked')?.value === 'true';
      const actionRaw = $('input[name="action"]:checked')?.value || 'allow';
      const action = (String(actionRaw).toLowerCase() === 'allow' || String(actionRaw).toLowerCase() === 'true');
      const disabled = $('input[name="disabled"]:checked')?.value === 'true';

      const scheduleIso = ddmmyyyyToISO($('#field-schedule').value.trim());
      const schedule = scheduleIso ? scheduleIso : null;

      // Build JSON payload as required
      const payload = {
        name: name,
        srcip: srcip,
        srcuser: srcuser,
        dstip: dstip,
        tcp_ports: tcp_ports,
        udp_ports: udp_ports,
        icmp: !!icmp,
        action: !!action,
        disabled: !!disabled,
        schedule: schedule,
        order_index: Math.trunc(order_index_num),
        domains: domains
      };

      return payload;
    }

    // Create handler
    $('#createBtn').addEventListener('click', async () => {
      try {
        // Validate and build payload
        const payload = buildCreatePayload();
        showStatus('Creating policy...', true, 0);

        const resp = await fetch('/create_policy', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!resp.ok) {
          let errMsg = `Failed to create policy (status ${resp.status})`;
          try {
            const j = await resp.json();
            if (j && j.error) errMsg = j.error;
            else if (j && j.message) errMsg = j.message;
          } catch (e) {
            // ignore parse error
          }
          showStatus(errMsg, false, 4000);
          return;
        }

        // success
        showStatus('Policy created successfully', true, 4000);
        setTimeout(() => {
          window.location.href = '/dashboard';
        }, 1500);
      } catch (err) {
        showStatus(err.message || 'Failed to create policy', false, 4000);
      }
    });

    // Initialize small UI states
    window.addEventListener('DOMContentLoaded', () => {
      // ensure radio styling is applied for defaults
      attachRadioStyling();
      setDefaultRadios();
    });
  </script>

</body>
</html>
